name: CI & Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      trigger_publish:
        description: Set to true to publish to npm
        required: false
        default: 'false'

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'

permissions:
  contents: read

jobs:
  rust:
    name: Rust gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxi-dev libgl1-mesa-dev \
            libegl1 libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers \
            libasound2-dev libudev-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  node_package:
    name: Node package gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        # No Bevy system deps in this job: opt out of the live fixture parity
        # gate. The integration job runs the real journeys and must not skip.
        run: npm test
        env:
          BEVY_MCP_SKIP_FIXTURE_TESTS: '1'

      - name: Smoke packed CLI
        run: npm run smoke:packed

  integration:
    name: Real integration (Bevy fixture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxi-dev libgl1-mesa-dev \
            libegl1 libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers \
            libasound2-dev libudev-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Real MCP client integration
        run: xvfb-run -a npm run test:integration

      - name: Unit tests (fixture-gated enabled)
        # No BEVY_MCP_SKIP_FIXTURE_TESTS here: this job has the Rust toolchain
        # and Bevy system deps, so cargo.test.ts and type-guides-parity.test.ts
        # must run for real. Runs after test:integration so build/index.js and
        # the compiled fixture already exist. xvfb: the fixture opens a window.
        run: xvfb-run -a npm test

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs:
      - rust
      - node_package
      - integration
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_publish == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
